services:

  backend:
    build: .
    container_name: ai_trip_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: .
    container_name: ai_trip_streamlit

    ports:
      - "8501:8501"

    env_file:
      - .env

    command: streamlit run streamlit_app.py --server.address=0.0.0.0